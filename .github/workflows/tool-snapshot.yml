name: tool-snapshot

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare the snapshot with the latest genfeed.ai release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_tool_snapshot.py
